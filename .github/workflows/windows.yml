name: Koharu CI and source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Windows 앱도 빌드 (서버 수정은 체크하지 않음)
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      build_windows:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: koharu-remote-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      windows_needed: ${{ steps.native.outputs.windows_needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - name: Cancel older builds of this workflow and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/cancel_obsolete_runs.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Report Windows source impact (builds require explicit opt-in)
        id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ inputs.source_ref || '' }}
        run: python tools/needs_windows.py
      - run: python tools/checkout.py build/upstream
      - run: python -m compileall -q tools dgx comfyui tests
      - run: python -m pytest -q tests
        env:
          UPSTREAM_FIXTURE: build/upstream
      - run: python tools/apply.py build/upstream
      - name: Compose validation without running services
        env:
          VISION_AUTH_REQUIRED: 'false'
          VISION_API_TOKEN: ''
          VISION_MODEL_DIR: /tmp/offline-detector
          VISION_OCR_MODEL_DIR: /tmp/offline-hayai
          VISION_CACHE_DIR: /tmp/offline-cache
        run: |
          docker compose -f dgx/compose.yaml config --quiet
          VISION_BIND_ADDRESS=0.0.0.0 docker compose -f dgx/compose.yaml config --quiet
          VISION_BIND_ADDRESS=192.0.2.10 docker compose -f dgx/compose.yaml config --quiet
      - name: Validate RORem Compose without starting services
        env:
          ROREM_IMAGE: local/koharu-rorem:0.2.3
          ROREM_PIPELINE_DIR: /tmp/offline-rorem/pipeline
          ROREM_LORA_DIR: /tmp/offline-rorem/lora
          ROREM_CACHE_DIR: /tmp/offline-rorem-cache
        run: |
          docker compose -f dgx/compose.rorem.yaml config --quiet
          BIND_ADDRESS=0.0.0.0 docker compose -f dgx/compose.rorem.yaml config --quiet
          BIND_ADDRESS=192.0.2.10 docker compose -f dgx/compose.rorem.yaml config --quiet
      - name: Validate Qwen Compose without starting services
        env:
          QWEN_MODEL_DIR: /tmp/offline-qwen/model
          QWEN_CACHE_DIR: /tmp/offline-qwen/cache
        run: |
          docker compose -f dgx/compose.qwen.yaml config --quiet
          QWEN_BIND_ADDRESS=0.0.0.0 docker compose -f dgx/compose.qwen.yaml config --quiet
      - name: Validate ComfyUI bridge Compose
        run: docker compose -f dgx/compose.comfy.yaml config --quiet
      - name: Build CPU-only ComfyUI bridge image
        run: docker build --platform linux/amd64 -f dgx/Dockerfile.comfy -t koharu-comfy-ci dgx
      - name: Validate bridge imports without loading any GPU model
        run: docker run --rm -e QWEN_BACKEND=comfyui --entrypoint python koharu-comfy-ci -c "from qwen.app import app; from qwen.comfy_backend import build_graph"
      - name: Package reviewed source for DGX deployment
        run: python tools/package_source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koharu-remote-source
          path: dist/koharu-remote-v*-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: offline
    # Server work and upstream discovery never start a native rebuild implicitly.
    if: inputs.build_windows == true
    runs-on: windows-latest
    # Cold native builds and the Rust cache post-job upload share this budget.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Verify Windows Custom settings rollback
        shell: pwsh
        run: ./tests/test_rollback_custom_settings.ps1
      - run: rustup update stable
      - run: rustup default stable
      - run: rustup target add wasm32-unknown-unknown
      - run: python tools/checkout.py build/upstream
      - run: python tools/apply.py build/upstream
      - name: Refresh workspace lock data without dependency upgrades
        run: python tools/lock.py build/upstream
      - name: Cache Rust dependencies and Tauri CLI for future candidates
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: build/upstream -> target
          shared-key: koharu-remote-windows-x64
          cache-on-failure: true
      - name: Install pinned upstream frontend and build tools
        working-directory: build/upstream
        run: bun install --frozen-lockfile
      - name: Focused native remote tests
        working-directory: build/upstream
        run: cargo test --locked -p koharu-pipeline remote::tests --lib
      - name: Focused native regional inpainting tests
        working-directory: build/upstream
        run: cargo test --locked -p koharu-pipeline stages::inpainting::tests --lib
      - name: Generate command bindings from authoritative Rust commands
        working-directory: build/upstream
        run: cargo run --locked -p koharu-app --bin generate
      - name: Build separate unsigned Remote application
        working-directory: build/upstream
        shell: pwsh
        run: |
          $config = (Resolve-Path ../../tauri.remote.json).Path
          cargo tauri build --no-bundle --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package successful build with provenance and checksums
        run: python tools/package_windows.py build/upstream
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koharu-remote-windows-x64-candidate
          # Actions wraps the payload in a ZIP; do not upload its standalone ZIP too.
          path: dist/koharu-remote-*-windows-x64/
          if-no-files-found: error
          retention-days: 14
