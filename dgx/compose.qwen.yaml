name: koharu-qwen
services:
  qwen:
    image: local/koharu-qwen:0.6.0
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.qwen
      args:
        QWEN_BASE_IMAGE: ${QWEN_BASE_IMAGE:-local/koharu-rorem:0.2.3}
    restart: unless-stopped
    ports:
      - "${QWEN_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    environment:
      QWEN_MODEL_DIR: /models/qwen
      ROREM_AUTH_REQUIRED: ${QWEN_AUTH_REQUIRED:-false}
      ROREM_API_TOKEN: ${QWEN_API_TOKEN:-}
      ROREM_MAX_PIXELS: ${QWEN_MAX_PIXELS:-64000000}
      ROREM_MAX_UPLOAD_BYTES: ${QWEN_MAX_UPLOAD_BYTES:-134217728}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /cache/huggingface
      XDG_CACHE_HOME: /cache/xdg
      TORCH_HOME: /cache/torch
      CUDA_CACHE_PATH: /cache/cuda
    volumes:
      - type: bind
        source: ${QWEN_MODEL_DIR:?Run manage.py qwen init first}
        target: /models/qwen
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_CACHE_DIR:?Run manage.py qwen init first}
        target: /cache
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-m", "qwen.healthcheck"]
      interval: 30s
      timeout: 8s
      start_period: 900s
      retries: 3
    shm_size: 2gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
